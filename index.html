<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>돌 대결</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5f6873;
      --panel: rgba(255, 255, 255, 0.86);
      --line: rgba(23, 32, 42, 0.14);
      --left: #f2c94c;
      --right: #8f969d;
      --grass: #4f8c4c;
      --soil: #8a623e;
      --sky: #d9f0ff;
      --sun: #ffd166;
      --shadow: rgba(30, 34, 40, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #bfe6ff 0%, #f5fbff 54%, #e9f3df 54%, #d9ead0 100%);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: clamp(12px, 2vw, 24px);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .player-panel,
    .center-panel {
      min-height: 72px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 10px 28px var(--shadow);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .player-panel {
      display: grid;
      gap: 8px;
    }

    .player-top,
    .compact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 800;
      letter-spacing: 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .left-dot {
      background: var(--left);
    }

    .right-dot {
      background: var(--right);
    }

    .score {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      color: var(--muted);
    }

    .power-track {
      width: 100%;
      height: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(23, 32, 42, 0.08);
    }

    .power-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transition: transform 140ms ease;
    }

    .hp-track {
      width: 100%;
      height: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px;
      background: rgba(23, 32, 42, 0.08);
    }

    .hp-fill {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
    }

    .hp-cell {
      min-width: 0;
      border-radius: 3px;
      transition: background 160ms ease, opacity 160ms ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26);
    }

    .hp-fill.left .hp-cell:not(.empty) {
      background: linear-gradient(180deg, #ffe37a, #d39b24);
    }

    .hp-fill.right .hp-cell:not(.empty) {
      background: linear-gradient(180deg, #c3c8ce, #555d66);
    }

    .hp-cell.empty {
      background: rgba(23, 32, 42, 0.12);
      box-shadow: none;
      opacity: 0.75;
    }

    .center-panel {
      width: min(320px, 32vw);
      display: grid;
      gap: 8px;
      place-items: center;
      text-align: center;
    }

    .turn {
      width: 100%;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 900;
      white-space: nowrap;
    }

    .wind {
      min-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .wind-arrow {
      width: 42px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(48, 118, 184, 0.22);
      background: rgba(48, 118, 184, 0.08);
      font-size: 15px;
      line-height: 1;
    }

    .game-wrap {
      max-width: 1120px;
      width: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: min(100%, calc((100vh - 160px) * 1.777));
      aspect-ratio: 16 / 9;
      min-height: 300px;
      max-height: calc(100vh - 160px);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(23, 32, 42, 0.18);
      box-shadow: 0 22px 60px rgba(39, 57, 79, 0.24);
      background: var(--sky);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .message {
      position: absolute;
      inset: auto 18px 18px 18px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      font-weight: 800;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 12px 24px rgba(23, 32, 42, 0.12);
      backdrop-filter: blur(10px);
    }

    .mode-modal,
    .quiz-modal {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(23, 32, 42, 0.28);
      backdrop-filter: blur(4px);
      z-index: 3;
    }

    .mode-modal {
      background: rgba(23, 32, 42, 0.34);
      z-index: 5;
    }

    .mode-modal.hidden,
    .quiz-modal.hidden {
      display: none;
    }

    .mode-card {
      width: min(620px, 94%);
      border: 1px solid rgba(23, 32, 42, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 24px 70px rgba(23, 32, 42, 0.26);
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .mode-title {
      color: var(--ink);
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 900;
      text-align: center;
    }

    .mode-subtitle {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      word-break: keep-all;
    }

    .mode-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-button {
      width: 100%;
      height: auto;
      min-height: 70px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(23, 32, 42, 0.16);
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 10px 24px rgba(23, 32, 42, 0.12);
      display: grid;
      gap: 5px;
      justify-items: start;
      text-align: left;
      font: 900 17px/1.15 "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    }

    .mode-button.primary {
      background: #2f8f64;
      color: #ffffff;
    }

    .mode-button small {
      color: inherit;
      opacity: 0.76;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
      word-break: keep-all;
    }

    .quiz-card {
      width: min(620px, 94%);
      border: 1px solid rgba(23, 32, 42, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 22px 60px rgba(23, 32, 42, 0.22);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .quiz-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .quiz-question {
      color: var(--ink);
      font-size: clamp(16px, 2.2vw, 21px);
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .quiz-option {
      width: 100%;
      min-height: 58px;
      height: auto;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(23, 32, 42, 0.16);
      background: #ffffff;
      color: var(--ink);
      box-shadow: none;
      font: 800 14px/1.25 "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      white-space: normal;
      word-break: keep-all;
    }

    .quiz-option.correct {
      border-color: #29a766;
      background: #e6f7ee;
      color: #166a41;
    }

    .quiz-option.wrong {
      border-color: #e35b5b;
      background: #fff0f0;
      color: #a83232;
    }

    .quiz-option:disabled {
      cursor: default;
      opacity: 0.88;
      transform: none;
    }

    .quiz-result {
      min-height: 20px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      text-align: center;
    }

    .summary-modal {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(23, 32, 42, 0.24);
      backdrop-filter: blur(3px);
      z-index: 4;
    }

    .summary-modal.hidden {
      display: none;
    }

    .summary-card {
      width: min(720px, 96%);
      border: 1px solid rgba(23, 32, 42, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 22px 60px rgba(23, 32, 42, 0.24);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .summary-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 900;
      text-align: center;
      color: var(--ink);
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .summary-table th,
    .summary-table td {
      border: 1px solid rgba(23, 32, 42, 0.12);
      padding: 8px;
      text-align: center;
      vertical-align: middle;
    }

    .summary-table th {
      background: rgba(23, 32, 42, 0.06);
      color: var(--muted);
    }

    .summary-table td:first-child {
      color: var(--muted);
      width: 30%;
    }

    .summary-next {
      width: 132px;
      height: 42px;
      justify-self: center;
      border-radius: 8px;
      background: #2f8f64;
      color: #ffffff;
      font: 900 15px/1 "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      box-shadow: 0 10px 24px rgba(47, 143, 100, 0.28);
    }

    .controls {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .power-shell {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px var(--shadow);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .power-label,
    .power-value {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .power-fill {
      transform: scaleX(0);
      background: linear-gradient(90deg, #49b675, #f0c35a, #ee665f);
    }

    button {
      width: 46px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      box-shadow: 0 10px 28px var(--shadow);
      font: 900 24px/1 "Segoe UI Symbol", "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100svh;
        grid-template-rows: auto auto auto;
      }

      .hud {
        grid-template-columns: 1fr 1fr;
      }

      .center-panel {
        grid-column: 1 / -1;
        grid-row: 1;
        width: 100%;
        min-height: 56px;
      }

      .stage {
        width: 100%;
        min-height: 240px;
        max-height: none;
      }

      .controls {
        grid-template-columns: 1fr auto;
      }

      .power-shell {
        grid-template-columns: 1fr auto;
      }

      .power-label {
        display: none;
      }

      .quiz-options {
        grid-template-columns: 1fr;
      }

      .mode-actions {
        grid-template-columns: 1fr;
      }

      .summary-card {
        max-height: 92%;
        overflow: auto;
      }

      .summary-table {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hud" aria-label="게임 상태">
      <div class="player-panel" aria-label="왼쪽 플레이어">
        <div class="player-top">
          <div class="name"><span class="dot left-dot"></span><span id="leftName">노랑</span></div>
          <div class="score" id="leftScore">0승</div>
        </div>
        <div class="hp-track" aria-hidden="true"><div class="hp-fill left" id="leftHp"></div></div>
      </div>
      <div class="center-panel">
        <div class="turn" id="turnLabel">노랑 차례</div>
        <div class="wind" id="windLabel"><span class="wind-arrow">→</span><span>바람 0</span></div>
      </div>
      <div class="player-panel" aria-label="오른쪽 플레이어">
        <div class="player-top">
          <div class="name"><span class="dot right-dot"></span><span id="rightName">회색</span></div>
          <div class="score" id="rightScore">0승</div>
        </div>
        <div class="hp-track" aria-hidden="true"><div class="hp-fill right" id="rightHp"></div></div>
      </div>
    </section>

    <section class="game-wrap" aria-label="게임 화면">
      <div class="stage">
        <canvas id="game" width="960" height="540"></canvas>
        <div class="message" id="message">노랑 차례</div>
        <div class="mode-modal hidden" id="modeModal" aria-hidden="true">
          <div class="mode-card" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
            <div class="mode-title" id="modeTitle">모드 선택</div>
            <div class="mode-subtitle">친구와 번갈아 던지거나, 회색 AI와 대결해요.</div>
            <div class="mode-actions">
              <button class="mode-button primary" type="button" data-mode="pvp">
                <span>PvP</span>
                <small>지금처럼 두 플레이어가 번갈아 플레이</small>
              </button>
              <button class="mode-button" type="button" data-mode="pve" data-difficulty="easy">
                <span>PvE 하</span>
                <small>명중 35% · 문제 45%</small>
              </button>
              <button class="mode-button" type="button" data-mode="pve" data-difficulty="normal">
                <span>PvE 중</span>
                <small>명중 55% · 문제 65%</small>
              </button>
              <button class="mode-button" type="button" data-mode="pve" data-difficulty="hard">
                <span>PvE 상</span>
                <small>명중 75% · 문제 85%</small>
              </button>
            </div>
          </div>
        </div>
        <div class="quiz-modal hidden" id="quizModal" aria-hidden="true">
          <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quizQuestion">
            <div class="quiz-meta" id="quizMeta">코인 문제</div>
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-result" id="quizResult"></div>
          </div>
        </div>
        <div class="summary-modal hidden" id="summaryModal" aria-hidden="true">
          <div class="summary-card" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
            <div class="summary-title" id="summaryTitle"></div>
            <div id="summaryStats"></div>
            <button class="summary-next" id="summaryNext" type="button">모드 선택</button>
          </div>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="조작 영역">
      <div class="power-shell">
        <span class="power-label">파워</span>
        <div class="power-track" aria-hidden="true"><div class="power-fill" id="powerFill"></div></div>
        <span class="power-value" id="powerValue">0%</span>
      </div>
      <button id="restart" title="새 판" aria-label="새 판">↻</button>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const powerFill = document.querySelector("#powerFill");
    const powerValue = document.querySelector("#powerValue");
    const leftHp = document.querySelector("#leftHp");
    const rightHp = document.querySelector("#rightHp");
    const leftName = document.querySelector("#leftName");
    const rightName = document.querySelector("#rightName");
    const leftScore = document.querySelector("#leftScore");
    const rightScore = document.querySelector("#rightScore");
    const turnLabel = document.querySelector("#turnLabel");
    const windLabel = document.querySelector("#windLabel");
    const message = document.querySelector("#message");
    const restart = document.querySelector("#restart");
    const modeModal = document.querySelector("#modeModal");
    const modeButtons = document.querySelectorAll(".mode-button[data-mode]");
    const quizModal = document.querySelector("#quizModal");
    const quizMeta = document.querySelector("#quizMeta");
    const quizQuestion = document.querySelector("#quizQuestion");
    const quizOptions = document.querySelector("#quizOptions");
    const quizResult = document.querySelector("#quizResult");
    const summaryModal = document.querySelector("#summaryModal");
    const summaryTitle = document.querySelector("#summaryTitle");
    const summaryStats = document.querySelector("#summaryStats");
    const summaryNext = document.querySelector("#summaryNext");

    const W = canvas.width;
    const H = canvas.height;
    const mapScale = 2;
    const WORLD_W = W * mapScale;
    const worldScaleX = W / WORLD_W;
    const groundY = 448;
    const gravity = 350;
    const maxChargeMs = 1000;
    const maxHp = 10;
    const characterScale = 1.5;
    const hitRadius = 29 * characterScale;
    const throwRangeScale = 1;
    const projectileRadius = 10;
    const itemIconSize = 34;
    const itemIconGap = 22;
    const itemPriceButtonW = 54;
    const itemPriceButtonH = 24;
    const itemTypes = [
      { id: "dormammu", label: "도르마무", cost: 2, description: "방금 던진 각도와 세기로 한 번 더 자동 투척해요." },
      { id: "sizeup", label: "사이즈업", cost: 1, description: "다음 투척물이 2배 커져 맞추기 쉬워져요." },
      { id: "heal", label: "원기 회복", cost: 2, description: "구매 즉시 체력을 4칸 회복해요." },
      { id: "transparent", label: "투명", cost: 3, description: "다음 투척물이 장애물과 새를 그대로 통과해요." }
    ];
    const quizReward = 1;
    const quizEveryThrows = 4;
    const aiPlayerIndex = 1;
    const aiCriticalChance = 0.3;
    const aiProfiles = {
      easy: {
        label: "하",
        hitChance: 0.35,
        quizChance: 0.45,
        aimNoise: 86,
        missMin: 170,
        missMax: 285
      },
      normal: {
        label: "중",
        hitChance: 0.55,
        quizChance: 0.65,
        aimNoise: 48,
        missMin: 130,
        missMax: 230
      },
      hard: {
        label: "상",
        hitChance: 0.75,
        quizChance: 0.85,
        aimNoise: 22,
        missMin: 90,
        missMax: 175
      }
    };
    const quizPool = [
      {
        q: "제품 1개의 원가가 8,000원이고 이익 25%를 붙이면 판매가는?",
        choices: ["8,250원", "9,000원", "10,000원", "10,500원", "12,000원"],
        answer: 2
      },
      {
        q: "작업 시간 2시간에 18개를 만들었다. 같은 속도라면 1시간 생산량은?",
        choices: ["6개", "8개", "9개", "12개", "18개"],
        answer: 2
      },
      {
        q: "도면 축척 1:50에서 도면 길이 4cm는 실제 길이로 얼마인가?",
        choices: ["50cm", "1m", "2m", "4m", "20m"],
        answer: 2
      },
      {
        q: "불량품 3개, 전체 60개일 때 불량률은?",
        choices: ["3%", "5%", "6%", "10%", "20%"],
        answer: 1
      },
      {
        q: "1.5m는 몇 cm인가?",
        choices: ["15cm", "50cm", "100cm", "150cm", "1,500cm"],
        answer: 3
      },
      {
        q: "정가 20,000원을 10% 할인하면 판매가는?",
        choices: ["16,000원", "18,000원", "19,000원", "20,100원", "22,000원"],
        answer: 1
      },
      {
        q: "부품 1개가 250g이다. 4개의 무게는?",
        choices: ["500g", "750g", "1kg", "1.25kg", "2kg"],
        answer: 2

    };

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const rand = (min, max) => min + Math.random() * (max - min);
    const choose = (items) => items[Math.floor(Math.random() * items.length)];

    function freshActiveItems() {
      return {
        dormammu: false,
        sizeup: false,
        transparent: false
      };
    }

    function freshRoundStats() {
      return {
        throws: 0,
        hits: 0,
        criticals: 0,
        items: Object.fromEntries(itemTypes.map((item) => [item.id, 0])),
        quizCorrect: 0,
        obstacles: 0,
        birds: 0,
        selfHits: 0
      };
    }

    function activeAIProfile() {
      return aiProfiles[state.aiDifficulty] || aiProfiles.normal;
    }

    function isAIPlayer(playerIndex) {
      return state.gameMode === "pve" && playerIndex === aiPlayerIndex;
    }

    function isAITurn() {
      return state.gameStarted && state.phase === "aim" && isAIPlayer(state.turn);
    }

    function showModeSelect() {
      state.phase = "mode";
      state.gameStarted = false;
      state.aiThinking = false;
      state.charging = false;
      state.chargeRatio = 0;
      state.projectile = null;
      state.pendingRepeatShot = null;
      state.quiz = null;
      state.hoveredItem = null;
      quizModal.classList.add("hidden");
      quizModal.setAttribute("aria-hidden", "true");
      summaryModal.classList.add("hidden");
      summaryModal.setAttribute("aria-hidden", "true");
      modeModal.classList.remove("hidden");
      modeModal.setAttribute("aria-hidden", "false");
      updateHud();
      message.textContent = "모드를 선택해 주세요";
    }

    function chooseMode(mode, difficulty = "normal") {
      state.gameMode = mode;
      state.aiDifficulty = difficulty;
      state.gameStarted = true;
      state.aiThinking = false;
      if (!state.modeChosen) {
        state.scores = [0, 0];
        state.round = 0;
        state.modeChosen = true;
      }
      modeModal.classList.add("hidden");
      modeModal.setAttribute("aria-hidden", "true");
      startRound();
    }

      return [

          name: "노랑",

    function makeWind() {
      const dir = Math.random() < 0.5 ? -1 : 1;
      const speed = Math.floor(rand(2, 9));
      return {
        dir,
        speed,
        accel: dir * (speed * 8.5 + rand(0, 5))
      };
    }

    function makeObstacles() {
      const center = WORLD_W / 2;
      const count = Math.floor(rand(1, 4));
      const blocks = [];

      const lowerW = rand(92, 138);
      const lowerH = rand(58, 78);
      const characterHeight = 82 * characterScale;
      const lowerTop = groundY - rand(characterHeight * 1.3, characterHeight * 1.6);
      blocks.push({
        type: "rect",
        x: center - lowerW / 2 + rand(-18, 18),
        y: lowerTop,
        w: lowerW,
        h: lowerH
      });

      if (count >= 2) {
        const w = rand(78, 124);
        const h = rand(46, 68);
        const previousTop = blocks[0].y;
        blocks.push({
          type: "rect",
          x: center - w / 2 + rand(-52, 52),
          y: previousTop - rand(62, 88) - h,
          w,
          h
        });
      }

      if (count >= 3) {
        const w = rand(64, 108);
        const h = rand(38, 58);
        const previousTop = blocks[1].y;
        blocks.push({
          type: "rect",
          x: center - w / 2 + rand(-44, 44),
          y: Math.max(102, previousTop - rand(50, 78) - h),
          w,
          h
        });
      }

      return blocks.sort((a, b) => a.y - b.y);
    }

    function createBirds() {
      const lanes = [116, 154, 196];
      return lanes.map((y, index) => {
        const dir = index % 2 === 0 ? 1 : -1;
        const baseY = y + rand(-10, 12);
        return {
          x: dir > 0 ? rand(-180, WORLD_W * 0.35) : rand(WORLD_W * 0.65, WORLD_W + 180),
          y: baseY,
          baseY,
          vx: dir * rand(42, 76),
          bob: rand(0, Math.PI * 2),
          radiusX: rand(26, 34),
          radiusY: rand(12, 16),
          cooldown: 0
        };
      });
    }

    function startRound(winnerIndex = null) {
      if (winnerIndex !== null) {
        state.scores[winnerIndex] += 1;
      }
      state.round += 1;
      state.turn = (state.round + 1) % 2;
      state.phase = "aim";
      state.players = createPlayers();
      state.obstacles = makeObstacles();
      state.birds = createBirds();
      state.wind = makeWind();
      state.projectile = null;
      state.pendingRepeatShot = null;
      state.charging = false;
      state.chargeRatio = 0;
      state.aiThinking = false;
      state.throwsSinceWind = 0;
      state.throwsSinceQuiz = 0;
      state.quizQueue = [];
      state.quiz = null;
      state.winnerIndex = null;
      state.particles = [];
      state.effects = [];
      state.roundTimer = 0;
      quizModal.classList.add("hidden");
      quizModal.setAttribute("aria-hidden", "true");
      summaryModal.classList.add("hidden");
      summaryModal.setAttribute("aria-hidden", "true");
      state.aim = {
        x: state.players[state.turn].x + state.players[state.turn].face * 250,
        y: groundY - 230
      };
      updateHud();
      maybeScheduleAIAction();
    }

    function renderHpBar(container, hp) {
      if (container.children.length !== maxHp) {
        container.innerHTML = Array.from({ length: maxHp }, () => '<span class="hp-cell"></span>').join("");
      }
      Array.from(container.children).forEach((cell, index) => {
        cell.classList.toggle("empty", index >= hp);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formatItemStats(stats) {
      const used = itemTypes
        .map((item) => {
          const count = stats.items[item.id] || 0;
          return count > 0 ? `${item.label} ${count}` : "";
        })
        .filter(Boolean);
      return used.length ? used.join(", ") : "없음";
    }

    function showRoundSummary(winnerIndex) {
      const winner = state.players[winnerIndex];
      const rows = [
        ["투척 횟수", "throws"],
        ["HIT", "hits"],
        ["크리티컬", "criticals"],
        ["사용 아이템", "items"],
        ["맞춘 문제", "quizCorrect"],
        ["장애물 맞춤", "obstacles"],
        ["새 맞춤", "birds"],
        ["스스로 맞춤", "selfHits"]
      ];

      summaryTitle.textContent = `${winner.name} 승리!`;
      summaryStats.innerHTML = `
        <table class="summary-table">
          <thead>
            <tr>
              <th>기록</th>
              <th>${escapeHtml(state.players[0].name)}</th>
              <th>${escapeHtml(state.players[1].name)}</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(([label, key]) => {
              const values = state.players.map((player) => {
                const value = key === "items" ? formatItemStats(player.stats) : player.stats[key];
                return `<td>${escapeHtml(value)}</td>`;
              }).join("");
              return `<tr><td>${escapeHtml(label)}</td>${values}</tr>`;
            }).join("")}
          </tbody>
        </table>
      `;
      summaryModal.classList.remove("hidden");
      summaryModal.setAttribute("aria-hidden", "false");
    }

    function updateHud() {
      if (state.players.length < 2 || !state.wind) return;
      const active = state.players[state.turn];
      const windArrow = state.wind.dir > 0 ? "→" : "←";
      leftName.textContent = state.players[0].name;
      rightName.textContent = state.players[1].name;
      renderHpBar(leftHp, state.players[0].hp);
      renderHpBar(rightHp, state.players[1].hp);
      leftScore.textContent = `${state.scores[0]}승`;
      rightScore.textContent = `${state.scores[1]}승`;
      turnLabel.textContent = isAITurn() ? `${active.name} 생각 중` : `${active.name} 차례`;
      windLabel.innerHTML = `<span class="wind-arrow">${windArrow}</span><span>바람 ${state.wind.speed}m/s</span>`;
      powerFill.style.transform = `scaleX(${state.chargeRatio})`;
      powerValue.textContent = `${Math.round(state.chargeRatio * 100)}%`;
      if (state.phase === "aim") {
        message.textContent = isAITurn() ? `${active.name} 생각 중` : `${active.name} 차례`;
      } else if (state.phase === "mode") {
        message.textContent = "모드를 선택해 주세요";
      }
    }

    function screenPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const pointer = event.touches ? event.touches[0] : event;
      return {
        x: clamp((pointer.clientX - rect.left) / rect.width * W, 0, W),
        y: clamp((pointer.clientY - rect.top) / rect.height * H, 0, H)
      };
    }

    function canvasPoint(event) {
      const point = screenPoint(event);
      return {
        x: clamp(point.x / worldScaleX, 0, WORLD_W),
        y: point.y
      };
    }

    function playerAimPoint(player) {
      return {
        x: player.x + player.face * 23 * player.scale,
        y: player.y - 39 * player.scale
      };
    }

    function playerHitCenter(player) {
      return {
        x: player.x,
        y: player.y - 36 * player.scale
      };
    }

    function playerCrownPoint(player) {
      const top = player.kind === "cat" ? 82 : 77;
      return {
        x: player.x,
        y: player.y - top * player.scale
      };
    }

    function itemGroupCenterX(player) {
      const spacing = itemIconSize + itemIconGap;
      const halfW = ((itemTypes.length - 1) * spacing + itemPriceButtonW) / 2 + 8;
      const screenX = clamp(player.x * worldScaleX, halfW + 8, W - halfW - 8);
      return screenX / worldScaleX;
    }

    function itemIconLayout(player, index) {
      const offset = (index - (itemTypes.length - 1) / 2) * (itemIconSize + itemIconGap) / worldScaleX;
      return {
        x: itemGroupCenterX(player) + offset,
        y: 40,
        size: itemIconSize
      };
    }

    function itemButtonLayout(player, index) {
      const icon = itemIconLayout(player, index);
      return {
        x: icon.x,
        y: icon.y + itemIconSize / 2 + itemPriceButtonH / 2 + 7,
        w: itemPriceButtonW,
        h: itemPriceButtonH
      };
    }

    function itemAreaAtPoint(point) {
      const baseTop = 20;
      const baseBottom = 114;
      const areaCenterY = (baseTop + baseBottom) / 2;
      const areaHalfH = (baseBottom - baseTop) * 0.6;
      const areaTop = areaCenterY - areaHalfH;
      const areaBottom = areaCenterY + areaHalfH;
      const halfW = (((itemTypes.length - 1) * (itemIconSize + itemIconGap) + itemPriceButtonW) / 2 + 8) * 1.2;
      return state.players.some((player) => {
        const screenX = itemGroupCenterX(player) * worldScaleX;
        return (
          point.x >= screenX - halfW &&
          point.x <= screenX + halfW &&
          point.y >= areaTop &&
          point.y <= areaBottom
        );
      });
    }

    function itemHitAtPoint(point) {
      for (let playerIndex = 0; playerIndex < state.players.length; playerIndex += 1) {
        const player = state.players[playerIndex];
        for (let index = 0; index < itemTypes.length; index += 1) {
          const layout = itemButtonLayout(player, index);
          const screenX = layout.x * worldScaleX;
          const halfW = layout.w / 2;
          const halfH = layout.h / 2;
          if (
            point.x >= screenX - halfW &&
            point.x <= screenX + halfW &&
            point.y >= layout.y - halfH &&
            point.y <= layout.y + halfH
          ) {
            return { playerIndex, item: itemTypes[index] };
          }
        }
      }
      return null;
    }

    function itemIconAtPoint(point) {
      for (let playerIndex = 0; playerIndex < state.players.length; playerIndex += 1) {
        const player = state.players[playerIndex];
        for (let index = 0; index < itemTypes.length; index += 1) {
          const layout = itemIconLayout(player, index);
          const screenX = layout.x * worldScaleX;
          const half = layout.size / 2;
          if (
            point.x >= screenX - half &&
            point.x <= screenX + half &&
            point.y >= layout.y - half &&
            point.y <= layout.y + half
          ) {
            return { playerIndex, item: itemTypes[index] };
          }
        }
      }
      return null;
    }

    function itemById(itemId) {
      return itemTypes.find((item) => item.id === itemId);
    }

    function pickQuizQuestion() {
      let index = Math.floor(Math.random() * quizPool.length);
      if (quizPool.length > 1 && index === state.lastQuizIndex) {
        index = (index + 1 + Math.floor(Math.random() * (quizPool.length - 1))) % quizPool.length;
      }
      state.lastQuizIndex = index;
      return quizPool[index];
    }

    function renderQuiz() {
      if (!state.quiz) return;
      const player = state.players[state.quiz.playerIndex];
      const quiz = state.quiz.question;
      quizMeta.textContent = `${player.name} 코인 문제 · 정답 +${quizReward}코인`;
      quizQuestion.textContent = quiz.q;
      quizResult.textContent = state.quiz.answered ? quizResult.textContent : "";
      quizOptions.innerHTML = "";

      quiz.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quiz-option";
        button.textContent = choice;
        button.disabled = state.quiz.answered;
        if (state.quiz.answered) {
          if (index === quiz.answer) button.classList.add("correct");
          if (index === state.quiz.choice && index !== quiz.answer) button.classList.add("wrong");
        }
        button.addEventListener("click", () => answerQuiz(index));
        quizOptions.appendChild(button);
      });
    }

    function openQuiz() {
      if (state.phase === "roundover") return;
      const player = state.players[state.turn];
      state.phase = "quiz";
      state.charging = false;
      state.chargeRatio = 0;
      state.quiz = {
        playerIndex: state.turn,
        question: pickQuizQuestion(),
        answered: false,
        choice: -1
      };
      quizModal.classList.remove("hidden");
      quizModal.setAttribute("aria-hidden", "false");
      renderQuiz();
      updateHud();
      message.textContent = `${player.name} 코인 문제`;
      if (isAIPlayer(state.quiz.playerIndex)) {
        quizOptions.querySelectorAll("button").forEach((button) => {
          button.disabled = true;
        });
        message.textContent = `${player.name} 문제 푸는 중`;
        window.setTimeout(answerAIQuiz, 720);
      }
    }

    function queueQuizPair(firstPlayerIndex) {
      state.quizQueue = [firstPlayerIndex, firstPlayerIndex === 0 ? 1 : 0];
    }

    function openQueuedQuizForTurn() {
      if (state.quizQueue[0] !== state.turn) return false;
      state.quizQueue.shift();
      openQuiz();
      return true;
    }

    function closeQuiz() {
      quizModal.classList.add("hidden");
      quizModal.setAttribute("aria-hidden", "true");
      state.quiz = null;
      state.phase = "aim";
      updateHud();
      maybeScheduleAIAction();
    }

    function answerQuiz(choiceIndex) {
      if (!state.quiz || state.quiz.answered) return;
      const quiz = state.quiz.question;
      const player = state.players[state.quiz.playerIndex];
      const correct = choiceIndex === quiz.answer;
      state.quiz.answered = true;
      state.quiz.choice = choiceIndex;

      if (correct) {
        player.coins += quizReward;
        player.stats.quizCorrect += 1;
        player.mood = "smile";
        player.moodTimer = 0.8;
        quizResult.textContent = `정답! ${player.name} +${quizReward}코인`;
        message.textContent = `${player.name} +${quizReward}코인`;
        burst(player.x, player.y - 78 * player.scale, "#ffd166", 20);
      } else {
        quizResult.textContent = `오답! 정답은 ${quiz.choices[quiz.answer]}`;
        message.textContent = "오답, 코인 없음";
      }

      updateHud();
      renderQuiz();
      window.setTimeout(closeQuiz, 1050);
    }

    function answerAIQuiz() {
      if (!state.quiz || state.quiz.answered || !isAIPlayer(state.quiz.playerIndex)) return;
      const quiz = state.quiz.question;
      const profile = activeAIProfile();
      const willAnswerCorrectly = Math.random() < profile.quizChance;
      const wrongChoices = quiz.choices
        .map((_, index) => index)
        .filter((index) => index !== quiz.answer);
      const choice = willAnswerCorrectly ? quiz.answer : choose(wrongChoices);
      answerQuiz(choice);
    }

    function useItem(playerIndex, itemId) {
      const player = state.players[playerIndex];
      const item = itemById(itemId);
      if (!player) return false;
      if (state.phase !== "aim" || state.charging) {
        message.textContent = "지금은 아이템을 쓸 수 없어요";
        return true;
      }
      if (playerIndex !== state.turn) {
        message.textContent = "현재 차례의 아이템만 쓸 수 있어요";
        return true;
      }
      if (!item) return true;
      if (player.activeItems[itemId]) {
        message.textContent = "이미 다음 투척에 준비됐어요";
        return true;
      }
      if (player.coins < item.cost) {
        message.textContent = `${item.label}은 ${item.cost}코인이 필요해요`;
        return true;
      }

      if (itemId === "heal") {
        if (player.hp >= maxHp) {
          message.textContent = "체력이 이미 가득해요";
          return true;
        }
        player.coins -= item.cost;
        player.stats.items[itemId] += 1;
        player.hp = clamp(player.hp + 4, 0, maxHp);
        player.mood = "smile";
        player.moodTimer = 0.9;
        burst(player.x, player.y - 74 * player.scale, "#75d982", 24);
        spawnHitEffect(player.x, player.y - 92 * player.scale, "+4", false);
        updateHud();
        message.textContent = `${player.name} 원기 회복 구매! +4칸`;
        return true;
      }

      player.coins -= item.cost;
      player.stats.items[itemId] += 1;
      player.activeItems[itemId] = true;
      const itemColor = itemId === "sizeup" ? "#cfe9ff" : itemId === "transparent" ? "#b6f3ff" : "#d8c5ff";
      burst(player.x, player.y - 72 * player.scale, itemColor, 18);
      updateHud();
      message.textContent = `${player.name} ${item.label} 구매 완료`;
      return true;
    }

    function handleItemPointer(event) {
      const point = screenPoint(event);
      if (isAITurn()) {
        message.textContent = "AI 차례예요";
        return true;
      }
      const hit = itemHitAtPoint(point);
      if (!hit) {
        const iconHit = itemIconAtPoint(point);
        if (iconHit) {
          message.textContent = "아이콘 아래 구매 버튼을 눌러요";
          return true;
        }
        if (!itemAreaAtPoint(point)) return false;
        message.textContent = "아이템 영역에서는 발사하지 않아요";
        return true;
      }
      useItem(hit.playerIndex, hit.item.id);
      return true;
    }

    function updateItemHover(event) {
      state.hoveredItem = itemIconAtPoint(screenPoint(event));
    }

    function currentAimVector() {
      const player = state.players[state.turn];
      const origin = playerAimPoint(player);
      let dx = (state.aim.x - origin.x) * worldScaleX;
      let dy = state.aim.y - origin.y;

      if (dx * player.face < 18) {
        dx = player.face * 18;
      }
      dy = Math.min(dy, -10);

      const len = Math.hypot(dx, dy) || 1;
      return {
        x: dx / len / worldScaleX,
        y: dy / len
      };
    }

    function beginCharge(event) {
      if (state.phase !== "aim") return;
      if (isAITurn()) {
        message.textContent = "AI 차례예요";
        return;
      }
      state.aim = canvasPoint(event);
      state.charging = true;
      state.chargeStart = performance.now();
      state.chargeRatio = 0;
      updateHud();
    }

    function endCharge(event) {
      if (!state.charging || state.phase !== "aim") return;
      state.aim = canvasPoint(event);
      state.charging = false;
      launchStone();
    }

    function moveAim(event) {
      updateItemHover(event);
      if (state.phase !== "aim") return;
      if (isAITurn()) return;
      state.aim = canvasPoint(event);
    }

    function createProjectile(ownerIndex, dir, speed, radius, transparent = false) {
      const player = state.players[ownerIndex];
      const origin = playerAimPoint(player);
      player.stats.throws += 1;
      return {
        x: origin.x + dir.x * 22,
        y: origin.y + dir.y * 22,
        vx: dir.x * speed,
        vy: dir.y * speed,
        r: radius,
        transparent,
        bounced: false,
        criticalAllowed: !isAIPlayer(ownerIndex) || Math.random() < aiCriticalChance,
        trail: [],
        owner: ownerIndex
      };
    }

    function createProjectileFromVelocity(ownerIndex, vx, vy, radius, transparent = false) {
      const player = state.players[ownerIndex];
      const origin = playerAimPoint(player);
      const screenVx = vx * worldScaleX;
      const len = Math.hypot(screenVx, vy) || 1;
      player.stats.throws += 1;
      return {
        x: origin.x + (screenVx / len) / worldScaleX * 22,
        y: origin.y + vy / len * 22,
        vx,
        vy,
        r: radius,
        transparent,
        bounced: false,
        criticalAllowed: !isAIPlayer(ownerIndex) || Math.random() < aiCriticalChance,
        trail: [],
        owner: ownerIndex
      };
    }

    function launchStone() {
      const player = state.players[state.turn];
      const dir = currentAimVector();
      const charge = clamp(state.chargeRatio, 0.08, 1);
      const speed = (220 + charge * 440) * throwRangeScale;
      const radius = player.activeItems.sizeup ? projectileRadius * 2 : projectileRadius;
      const repeat = player.activeItems.dormammu;
      const transparent = player.activeItems.transparent;
      state.pendingRepeatShot = repeat
        ? { owner: state.turn, dir: { ...dir }, speed, radius, transparent }
        : null;
      player.activeItems.dormammu = false;
      player.activeItems.sizeup = false;
      player.activeItems.transparent = false;
      state.projectile = createProjectile(state.turn, dir, speed, radius, transparent);
      state.phase = "flight";
      message.textContent = "발사";
      updateHud();
      message.textContent = transparent ? "투명 투척" : repeat ? "도르마무 첫 투척" : "발사";
    }

    function maybeUseAIItem() {
      if (!isAITurn()) return;
      const ai = state.players[aiPlayerIndex];
      const profile = activeAIProfile();
      const heal = itemById("heal");
      const transparent = itemById("transparent");
      const sizeup = itemById("sizeup");

      if (ai.hp <= 6 && heal && ai.coins >= heal.cost && Math.random() < 0.82) {
        useItem(aiPlayerIndex, "heal");
        return;
      }

      if (
        transparent &&
        ai.coins >= transparent.cost &&
        !ai.activeItems.transparent &&
        Math.random() < (profile.hitChance >= 0.75 ? 0.22 : 0.14)
      ) {
        useItem(aiPlayerIndex, "transparent");
        return;
      }

      if (sizeup && ai.coins >= sizeup.cost && !ai.activeItems.sizeup && Math.random() < 0.36) {
        useItem(aiPlayerIndex, "sizeup");
      }
    }

    function launchAIStone() {
      if (!isAITurn()) {
        state.aiThinking = false;
        return;
      }

      maybeUseAIItem();

      const ai = state.players[aiPlayerIndex];
      const target = state.players[0];
      const profile = activeAIProfile();
      const origin = playerAimPoint(ai);
      const center = playerHitCenter(target);
      const accurateAim = Math.random() < profile.hitChance;
      let targetX = center.x;
      let targetY = center.y - rand(0, 12);

      if (accurateAim) {
        targetX += rand(-profile.aimNoise, profile.aimNoise) / worldScaleX;
        targetY += rand(-profile.aimNoise * 0.32, profile.aimNoise * 0.32);
      } else {
        targetX += choose([-1, 1]) * rand(profile.missMin, profile.missMax) / worldScaleX;
        targetY += rand(-78, 90);
      }

      const flightTime = accurateAim ? rand(1.55, 2.2) : rand(1.25, 2.05);
      const vx = (targetX - origin.x - 0.5 * state.wind.accel * flightTime * flightTime) / flightTime;
      const vy = (targetY - origin.y - 0.5 * gravity * flightTime * flightTime) / flightTime;
      const radius = ai.activeItems.sizeup ? projectileRadius * 2 : projectileRadius;
      const transparent = ai.activeItems.transparent;

      ai.activeItems.dormammu = false;
      ai.activeItems.sizeup = false;
      ai.activeItems.transparent = false;
      state.pendingRepeatShot = null;
      state.projectile = createProjectileFromVelocity(aiPlayerIndex, vx, vy, radius, transparent);
      state.phase = "flight";
      state.aiThinking = false;
      state.chargeRatio = 0;
      updateHud();
      message.textContent = transparent ? `${ai.name} 투명 투척` : `${ai.name} 발사`;
    }

    function maybeScheduleAIAction() {
      if (!isAITurn() || state.aiThinking || state.quiz || state.projectile) return;
      const round = state.round;
      const ai = state.players[aiPlayerIndex];
      state.aiThinking = true;
      state.charging = false;
      state.chargeRatio = 0;
      updateHud();
      message.textContent = `${ai.name} 생각 중`;
      window.setTimeout(() => {
        if (state.round !== round || !isAITurn()) {
          state.aiThinking = false;
          return;
        }
        launchAIStone();
      }, rand(700, 1120));
    }

    function launchRepeatShot() {
      const shot = state.pendingRepeatShot;
      state.pendingRepeatShot = null;
      if (!shot || state.phase === "roundover") return false;
      const player = state.players[shot.owner];
      if (!player || player.hp <= 0) return false;

      state.turn = shot.owner;
      state.projectile = createProjectile(shot.owner, shot.dir, shot.speed, shot.radius, shot.transparent);
      state.phase = "flight";
      state.chargeRatio = 0;
      updateHud();
      message.textContent = "도르마무 재투척";
      return true;
    }

    function finishShot(delay = 520) {
      state.phase = "waiting";
      state.projectile = null;
      updateHud();
      window.setTimeout(() => {
        if (!launchRepeatShot()) {
          nextTurn();
        }
      }, delay);
    }

    function nextTurn() {
      state.throwsSinceWind += 1;
      state.throwsSinceQuiz += 1;
      const windChanged = state.throwsSinceWind >= 6;
      const quizDue = state.throwsSinceQuiz >= quizEveryThrows;
      if (windChanged) {
        state.wind = makeWind();
        state.throwsSinceWind = 0;
      }
      if (quizDue) {
        state.throwsSinceQuiz = 0;
      }
      state.turn = state.turn === 0 ? 1 : 0;
      if (quizDue) {
        queueQuizPair(state.turn);
      }
      state.phase = "aim";
      state.projectile = null;
      state.chargeRatio = 0;
      const player = state.players[state.turn];
      state.aim = {
        x: player.x + player.face * 250,
        y: groundY - 230
      };
      updateHud();
      if (windChanged) {
        const arrow = state.wind.dir > 0 ? "→" : "←";
        message.textContent = `바람 변경 ${arrow} ${state.wind.speed}m/s`;
      }
      if (!openQueuedQuizForTurn()) {
        maybeScheduleAIAction();
      }
    }

    function rectCircle(rect, circle) {
      const cx = clamp(circle.x, rect.x, rect.x + rect.w);
      const cy = clamp(circle.y, rect.y, rect.y + rect.h);
      return Math.hypot((circle.x - cx) * worldScaleX, circle.y - cy) <= circle.r;
    }

    function obstacleHit(projectile) {
      return state.obstacles.some((obstacle) => {
        return rectCircle(obstacle, projectile);
      });
    }

    function birdHit(projectile) {
      return state.birds.find((bird) => {
        if (bird.cooldown > 0) return false;
        const dx = (projectile.x - bird.x) * worldScaleX;
        const dy = projectile.y - bird.y;
        const rx = bird.radiusX + projectile.r;
        const ry = bird.radiusY + projectile.r;
        return (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1;
      });
    }

    function bounceFromBird(projectile, bird) {
      const dx = (projectile.x - bird.x) * worldScaleX;
      const dy = projectile.y - bird.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = dx / len;
      const ny = dy / len;
      const svx = projectile.vx * worldScaleX;
      const svy = projectile.vy;
      const birdVx = bird.vx * worldScaleX;
      const relativeVx = svx - birdVx;
      const relativeVy = svy;
      const dot = Math.min(relativeVx * nx + relativeVy * ny, 0);
      const bounce = 1.06;
      let outVx = relativeVx - (1 + bounce) * dot * nx + birdVx * 0.8;
      let outVy = relativeVy - (1 + bounce) * dot * ny - 28;

      projectile.vx = outVx / worldScaleX;
      projectile.vy = outVy;
      projectile.bounced = true;
      projectile.x += nx / worldScaleX * 18;
      projectile.y += ny * 18;
      projectile.trail = [];
      bird.cooldown = 0.28;
      bird.bob += 1.8;
      burst(projectile.x, projectile.y, "#fff7d7", 16);
      state.effects.push({
        x: projectile.x,
        y: projectile.y - 16,
        label: "튕김",
        critical: false,
        age: 0,
        life: 0.55
      });
    }

    function burst(x, y, color, count = 18) {
      for (let i = 0; i < count; i += 1) {
        const a = rand(0, Math.PI * 2);
        const s = rand(34, 150);
        state.particles.push({
          x,
          y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - rand(20, 70),
          life: rand(0.35, 0.75),
          age: 0,
          color
        });
      }
    }

    function spawnHitEffect(x, y, label = "HIT", critical = false) {
      state.effects.push({
        x,
        y,
        label,
        critical,
        age: 0,
        life: critical ? 1.15 : 0.8
      });
    }

    function hitPlayer(target, projectile) {
      const center = playerHitCenter(target);
      const distance = Math.hypot((projectile.x - center.x) * worldScaleX, projectile.y - center.y);
      return distance < hitRadius + projectile.r;
    }

    function isCriticalHit(target, projectile) {
      const crown = playerCrownPoint(target);
      const dx = (projectile.x - crown.x) * worldScaleX;
      const dy = projectile.y - crown.y;
      const halfEarGap = 32 * target.scale;
      const crownHeight = 12 * target.scale;
      const rx = halfEarGap + projectile.r;
      const ry = crownHeight + projectile.r;
      return (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1;
    }

    function applyHit(targetIndex, projectile, critical = false) {
      const target = state.players[targetIndex];
      const attacker = state.players[state.turn];
      const owner = state.players[projectile.owner] || attacker;
      const damage = critical ? 2 : 1;
      if (targetIndex === projectile.owner) {
        owner.stats.selfHits += 1;
      } else {
        owner.stats.hits += 1;
        if (critical) owner.stats.criticals += 1;
      }
      target.hp = clamp(target.hp - damage, 0, maxHp);
      target.mood = "cry";
      target.moodTimer = critical ? 1.35 : 1.05;
      if (attacker !== target) {
        attacker.mood = "smile";
        attacker.moodTimer = critical ? 1.35 : 1.05;
      }
      burst(projectile.x, projectile.y, critical ? "#ffd84a" : "#f7f7f0", critical ? 42 : 24);
      spawnHitEffect(projectile.x, projectile.y - 18, critical ? "크리티컬" : "HIT", critical);
      message.textContent = critical ? `크리티컬 ${target.name} -2칸` : `${target.name} -1칸`;
      if (target.hp <= 0) {
        const winner = targetIndex === 0 ? 1 : 0;
        state.phase = "roundover";
        state.winnerIndex = winner;
        state.projectile = null;
        state.pendingRepeatShot = null;
        state.roundTimer = 0;
        state.scores[winner] += 1;
        state.players[winner].mood = "smile";
        state.players[winner].moodTimer = 999;
        burst(state.players[winner].x, state.players[winner].y - 92 * state.players[winner].scale, "#ffd166", 52);
        spawnHitEffect(state.players[winner].x, state.players[winner].y - 116 * state.players[winner].scale, "WIN", false);
        message.textContent = `${state.players[winner].name} 승`;
        showRoundSummary(winner);
        updateHud();
        return;
      }
      finishShot();
    }

    function updateProjectile(dt) {
      const p = state.projectile;
      if (!p) return;

      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 16) p.trail.shift();
      p.vx += state.wind.accel * dt;
      p.vy += gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const bird = p.transparent ? null : birdHit(p);
      if (bird) {
        state.players[p.owner].stats.birds += 1;
        bounceFromBird(p, bird);
      }

      const targetIndices = p.bounced ? [0, 1] : [state.turn === 0 ? 1 : 0];
      for (const targetIndex of targetIndices) {
        const criticalZone = isCriticalHit(state.players[targetIndex], p);
        const critical = criticalZone && p.criticalAllowed;
        if (criticalZone || hitPlayer(state.players[targetIndex], p)) {
          applyHit(targetIndex, p, critical);
          return;
        }
      }

      if (!p.transparent && obstacleHit(p)) {
        state.players[p.owner].stats.obstacles += 1;
        burst(p.x, p.y, "#f7f7f0", 18);
        message.textContent = "장애물";
        finishShot();
        return;
      }

      if (p.y + p.r >= groundY) {
        burst(p.x, groundY, "#f7f7f0", 12);
        message.textContent = "빗나감";
        finishShot();
        return;
      }

      if (p.x < -80 || p.x > WORLD_W + 80 || p.y < -120) {
        message.textContent = "빗나감";
        finishShot();
      }
    }

    function updateParticles(dt) {
      state.particles = state.particles.filter((particle) => {
        particle.age += dt;
        particle.vy += gravity * 0.55 * dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        return particle.age < particle.life;
      });
    }

    function updateBirds(dt) {
      state.birds.forEach((bird) => {
        bird.x += bird.vx * dt;
        bird.bob += dt * 7;
        bird.y = bird.baseY + Math.sin(bird.bob) * 7;
        bird.cooldown = Math.max(0, bird.cooldown - dt);

        if (bird.vx > 0 && bird.x > WORLD_W + 90) {
          bird.x = -90;
          bird.baseY = rand(104, 214);
          bird.y = bird.baseY;
        } else if (bird.vx < 0 && bird.x < -90) {
          bird.x = WORLD_W + 90;
          bird.baseY = rand(104, 214);
          bird.y = bird.baseY;
        }
      });
    }

    function updateEffects(dt) {
      state.players.forEach((player) => {
        if (player.moodTimer > 0) {
          player.moodTimer -= dt;
          if (player.moodTimer <= 0) {
            player.mood = "normal";
            player.moodTimer = 0;
          }
        }
      });
      state.effects = state.effects.filter((effect) => {
        effect.age += dt;
        return effect.age < effect.life;
      });
    }

    function update(dt, now) {
      if (state.charging) {
        state.chargeRatio = clamp((now - state.chargeStart) / maxChargeMs, 0, 1);
        updateHud();
      }

      if (state.phase === "flight") {
        updateProjectile(dt);
      }

      if (state.phase === "roundover") {
        state.roundTimer += dt;
      }

      updateParticles(dt);
      updateEffects(dt);
      updateBirds(dt);
    }

    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, groundY);
      grad.addColorStop(0, "#b7e6ff");
      grad.addColorStop(0.62, "#eefbff");

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, groundY);

      drawCloud(220, 86, 1);

    function drawGround() {
      ctx.fillStyle = "#5c9b58";

      ctx.fillRect(0, groundY, WORLD_W, 12);

      ctx.lineWidth = 2;
      for (let x = 16; x < WORLD_W; x += 38) {
        ctx.beginPath();

        ctx.lineTo(x + 10, groundY - 8);
        ctx.stroke();
      }

    function drawObstacle(obstacle) {
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.18)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 6;

      ctx.fillStyle = "#b66b52";
      ctx.strokeStyle = "#6d4035";
      ctx.lineWidth = 3;
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
      ctx.strokeRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);

      ctx.shadowColor = "transparent";
      ctx.save();
      ctx.beginPath();
      ctx.rect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
      ctx.clip();

      const brickH = 16;
      const brickW = 30;
      for (let y = obstacle.y; y < obstacle.y + obstacle.h; y += brickH) {
        const row = Math.floor((y - obstacle.y) / brickH);
        const offset = row % 2 === 0 ? 0 : -brickW / 2;
        for (let x = obstacle.x + offset; x < obstacle.x + obstacle.w; x += brickW) {
          ctx.fillStyle = row % 2 === 0 ? "#c77a5d" : "#a85f4d";
          ctx.fillRect(x + 1, y + 1, brickW - 2, brickH - 2);
        }
      }
      ctx.strokeStyle = "rgba(96, 55, 45, 0.64)";
      ctx.lineWidth = 1;
      for (let y = obstacle.y; y <= obstacle.y + obstacle.h; y += brickH) {
        ctx.beginPath();
        ctx.moveTo(obstacle.x, y);
        ctx.lineTo(obstacle.x + obstacle.w, y);
        ctx.stroke();
      }
      ctx.restore();

      ctx.fillStyle = "rgba(255,255,255,0.16)";
      ctx.fillRect(obstacle.x + 7, obstacle.y + 8, Math.max(8, obstacle.w - 14), 6);
      ctx.restore();
    }

    function drawCuteFace(player, face) {
      const mood = player.mood || "normal";
      ctx.save();
      ctx.lineCap = "round";

      if (mood === "smile") {
        ctx.strokeStyle = "#272018";

        ctx.beginPath();
        ctx.arc(face.leftEye.x, face.leftEye.y, 3.5, 0.18, Math.PI - 0.18);
        ctx.arc(face.rightEye.x, face.rightEye.y, 3.5, 0.18, Math.PI - 0.18);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#272018";
        ctx.beginPath();
        ctx.ellipse(face.leftEye.x, face.leftEye.y, 2.3, 3.1, 0, 0, Math.PI * 2);
        ctx.ellipse(face.rightEye.x, face.rightEye.y, 2.3, 3.1, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (mood === "cry") {
        ctx.strokeStyle = "#272018";
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(face.leftEye.x - 5, face.leftEye.y - 6);
        ctx.lineTo(face.leftEye.x + 1, face.leftEye.y - 8);
        ctx.moveTo(face.rightEye.x - 1, face.rightEye.y - 8);
        ctx.lineTo(face.rightEye.x + 5, face.rightEye.y - 6);
        ctx.stroke();

        ctx.fillStyle = "#65b8ff";
        ctx.beginPath();
        ctx.ellipse(face.leftEye.x - 2, face.leftEye.y + 8, 2.2, 4.2, 0.1, 0, Math.PI * 2);
        ctx.ellipse(face.rightEye.x + 2, face.rightEye.y + 8, 2.2, 4.2, -0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = face.noseColor;
      ctx.beginPath();
      ctx.arc(face.nose.x, face.nose.y, face.nose.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = face.mouthColor;
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      if (mood === "cry") {
        ctx.arc(face.mouth.x, face.mouth.y + 7, face.mouth.r, Math.PI + 0.22, Math.PI * 2 - 0.22);

        const size = mood === "smile" ? face.mouth.r + 3 : face.mouth.r;
        ctx.arc(face.mouth.x, face.mouth.y, size, 0.18, Math.PI - 0.18);

      ctx.stroke();

      ctx.fillStyle = "rgba(255, 135, 145, 0.42)";

      ctx.arc(face.leftBlush.x, face.leftBlush.y, 3.2, 0, Math.PI * 2);
      ctx.arc(face.rightBlush.x, face.rightBlush.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

        leftBlush: { x: -14, y: -56 },
        rightBlush: { x: 20, y: -56 },
        noseColor: "#1d2428",
        mouthColor: "#1d2428"
      });
    }

    function drawPlayer(player, index) {
      const wounded = 1 - player.hp / maxHp;
      const dancing = state.phase === "roundover" && state.winnerIndex === index;
      const danceTime = performance.now() / 1000;
      const danceLift = dancing ? Math.abs(Math.sin(danceTime * 8)) * 18 + 4 : 0;
      const danceSwing = dancing ? Math.sin(danceTime * 10) * 0.16 : 0;
      ctx.save();
      ctx.translate(player.x, player.y - danceLift);
      if (dancing) {
        ctx.rotate(danceSwing);
      }
      ctx.scale(player.face * player.scale / worldScaleX, player.scale);

      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath();
      ctx.ellipse(0, 2, 30, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      if (player.kind === "retriever") {
        drawRetriever(player, wounded);
      } else {
        drawCat(player, wounded);
      }

      ctx.restore();

      if (state.turn === index && state.phase === "aim") {
        const center = playerHitCenter(player);
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.scale(1 / worldScaleX, 1);
        ctx.strokeStyle = index === 0 ? "rgba(242,201,76,0.46)" : "rgba(143,150,157,0.46)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, hitRadius + Math.sin(performance.now() / 170) * 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawAim() {
      if (state.phase !== "aim") return;
      const player = state.players[state.turn];
      const dir = currentAimVector();
      const charge = state.charging ? Math.max(0.12, state.chargeRatio) : 0.28;
      const length = 80 + charge * 118;
      const origin = playerAimPoint(player);
      const sx = origin.x;
      const sy = origin.y;
      const ex = sx + dir.x * length;
      const ey = sy + dir.y * length;

      ctx.save();
      ctx.strokeStyle = player.dark;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.setLineDash([5, 8]);
      ctx.globalAlpha = 0.34;
      ctx.beginPath();
      ctx.moveTo(sx, groundY);
      ctx.lineTo(sx + dir.x * 120, groundY);
      ctx.stroke();
      ctx.restore();
    }

    function drawProjectile() {
      const p = state.projectile;
      if (!p) return;
      ctx.save();
      p.trail.forEach((point, index) => {
        const alpha = index / p.trail.length;
        ctx.fillStyle = p.transparent
          ? `rgba(127, 224, 255, ${alpha * 0.28})`
          : `rgba(235, 235, 225, ${alpha * 0.34})`;
        ctx.save();
        ctx.translate(point.x, point.y);
        ctx.scale(1 / worldScaleX, 1);
        ctx.beginPath();
        ctx.arc(0, 0, p.r * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.translate(p.x, p.y);
      ctx.scale(1 / worldScaleX, 1);
      ctx.globalAlpha = p.transparent ? 0.62 : 1;
      ctx.fillStyle = p.transparent ? "#e8fbff" : "#fbfbf2";
      ctx.strokeStyle = p.transparent ? "#38a9c8" : "#7d8288";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (p.transparent) {
        ctx.strokeStyle = "rgba(56,169,200,0.78)";
        ctx.lineWidth = 1.6;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, p.r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.strokeStyle = p.transparent ? "#62c7dc" : "#b9bec4";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-6, -1);
      ctx.quadraticCurveTo(-1, -7, 5, -4);
      ctx.moveTo(-5, 4);
      ctx.quadraticCurveTo(0, 1, 7, 5);
      ctx.moveTo(-1, -8);
      ctx.quadraticCurveTo(2, -1, -2, 7);
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.78)";
      ctx.beginPath();
      ctx.arc(-3, -4, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawParticles() {
      state.particles.forEach((particle) => {
        const alpha = 1 - particle.age / particle.life;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = particle.color;
        ctx.translate(particle.x, particle.y);
        ctx.scale(1 / worldScaleX, 1);
        ctx.beginPath();
        ctx.arc(0, 0, 4 * alpha + 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawWindRibbon() {
      const y = 34;
      const direction = state.wind.dir;
      ctx.save();
      ctx.strokeStyle = "rgba(48,118,184,0.24)";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      for (let i = 0; i < 5; i += 1) {
        const base = (performance.now() / Math.max(12, 32 - state.wind.speed * 2.2) + i * 340) % (WORLD_W + 100) - 50;
        const x = direction > 0 ? base : WORLD_W - base;
        ctx.beginPath();
        ctx.moveTo(x, y + i * 28);
        ctx.quadraticCurveTo(x + direction * 28, y + 8 + i * 28, x + direction * 62, y + i * 28);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHitEffects() {
      state.effects.forEach((effect) => {
        const progress = effect.age / effect.life;
        const alpha = 1 - progress;
        const y = effect.y - progress * 34;
        const scale = 1 + progress * 0.45;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(effect.x, y);
        ctx.scale(scale / worldScaleX, scale);

        ctx.strokeStyle = effect.critical ? "rgba(255, 235, 84, 0.95)" : "rgba(255, 205, 54, 0.8)";
        ctx.lineWidth = effect.critical ? 5 : 4;
        const rays = effect.critical ? 14 : 8;
        for (let i = 0; i < rays; i += 1) {
          const a = i / rays * Math.PI * 2;
          const inner = effect.critical ? 34 : 28;
          const outer = effect.critical ? 58 : 43;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner * 0.65);
          ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer * 0.65);
          ctx.stroke();
        }

        ctx.font = effect.critical
          ? "900 32px Segoe UI, Malgun Gothic, Arial, sans-serif"
          : "900 30px Segoe UI, Malgun Gothic, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = effect.critical ? 9 : 7;
        ctx.strokeText(effect.label, 0, 0);
        ctx.fillStyle = effect.critical
          ? "#ffb000"
          : effect.label.startsWith("+")
            ? "#39c978"
            : effect.label === "튕김" ? "#39a7ff" : "#ff5959";
        ctx.fillText(effect.label, 0, 0);
        ctx.restore();
      });
    }

    function drawItemSymbols(itemId, active) {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (itemId === "dormammu") {
        ctx.strokeStyle = active ? "#ffffff" : "#6e4fc4";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 1, 9, -0.35, Math.PI * 1.45);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-10, -5);
        ctx.lineTo(-15, -5);
        ctx.lineTo(-12, -11);
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fill();
        return;
      }

      if (itemId === "sizeup") {
        ctx.fillStyle = active ? "#ffffff" : "#f7fbff";
        ctx.strokeStyle = "#60758b";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(-4, 2, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(7, -6, 4.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = active ? "#ffffff" : "#2873b9";
        ctx.font = "900 10px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("2x", 5, 8);
        return;
      }

      if (itemId === "transparent") {
        ctx.globalAlpha *= active ? 0.92 : 0.78;
        ctx.fillStyle = active ? "#ffffff" : "#b6f3ff";
        ctx.strokeStyle = active ? "#ffffff" : "#2687a6";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = active ? "#2687a6" : "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-13, 6);
        ctx.lineTo(13, -6);
        ctx.moveTo(-13, -3);
        ctx.lineTo(13, -15);
        ctx.stroke();
        return;
      }

      ctx.fillStyle = active ? "#ffffff" : "#41b36b";
      ctx.beginPath();
      ctx.moveTo(0, 12);
      ctx.bezierCurveTo(-14, 2, -12, -11, -3, -7);
      ctx.bezierCurveTo(0, -14, 13, -11, 12, 0);
      ctx.bezierCurveTo(11, 6, 5, 9, 0, 12);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(0, 5);
      ctx.moveTo(-5, 0);
      ctx.lineTo(5, 0);
      ctx.stroke();
    }

    function drawItemIcons() {
      state.players.forEach((player, playerIndex) => {
        itemTypes.forEach((item, index) => {
          const layout = itemIconLayout(player, index);
          const active = Boolean(player.activeItems[item.id]);
          const isTurn = state.turn === playerIndex && state.phase === "aim";
          const canBuy = player.coins >= item.cost;

          ctx.save();
          ctx.translate(layout.x, layout.y);
          ctx.scale(1 / worldScaleX, 1);
          ctx.globalAlpha = active ? 1 : isTurn && canBuy ? 1 : 0.46;

          const half = layout.size / 2;
          ctx.fillStyle = active ? player.dark : "rgba(255, 255, 255, 0.88)";
          ctx.strokeStyle = active ? "#ffffff" : isTurn && canBuy ? player.dark : "rgba(23, 32, 42, 0.24)";
          ctx.lineWidth = active ? 3 : 2;
          ctx.beginPath();
          ctx.roundRect(-half, -half, layout.size, layout.size, 7);
          ctx.fill();
          ctx.stroke();

          if (isTurn && canBuy && !active) {
            ctx.strokeStyle = "rgba(255,255,255,0.92)";
            ctx.lineWidth = 1.4;
            ctx.strokeRect(-half + 4, -half + 4, layout.size - 8, layout.size - 8);
          }

          drawItemSymbols(item.id, active);

          const buttonY = itemIconSize / 2 + itemPriceButtonH / 2 + 7;
          const buttonReady = active;
          const buttonEnabled = isTurn && canBuy && !active;
          ctx.globalAlpha = active ? 1 : isTurn && canBuy ? 1 : 0.56;
          ctx.fillStyle = buttonReady ? player.dark : buttonEnabled ? "#2f8f64" : "rgba(255,255,255,0.82)";
          ctx.strokeStyle = buttonReady ? "#ffffff" : buttonEnabled ? "#166342" : "rgba(23, 32, 42, 0.28)";
          ctx.lineWidth = buttonEnabled || buttonReady ? 2.2 : 1.6;
          ctx.beginPath();
          ctx.roundRect(-itemPriceButtonW / 2, buttonY - itemPriceButtonH / 2, itemPriceButtonW, itemPriceButtonH, 6);
          ctx.fill();
          ctx.stroke();

          if (buttonEnabled) {
            ctx.fillStyle = "rgba(255,255,255,0.22)";
            ctx.fillRect(-itemPriceButtonW / 2 + 4, buttonY - itemPriceButtonH / 2 + 3, itemPriceButtonW - 8, 4);
          }

          ctx.fillStyle = buttonReady ? "#ffffff" : buttonEnabled ? "#ffffff" : player.dark;
          ctx.font = "900 10px Segoe UI, Malgun Gothic, Arial, sans-serif";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(buttonReady ? "준비됨" : "구매", -itemPriceButtonW / 2 + 8, buttonY + 0.5);

          if (!buttonReady) {
            ctx.fillStyle = buttonEnabled ? "#ffd166" : "#e4b648";
            ctx.strokeStyle = buttonEnabled ? "#ffffff" : "#9b6f16";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(itemPriceButtonW / 2 - 17, buttonY, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = buttonEnabled ? "#ffffff" : player.dark;
            ctx.font = "900 10px Segoe UI, Arial, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(String(item.cost), itemPriceButtonW / 2 - 8, buttonY + 0.5);
          }
          ctx.restore();
        });

        const center = { x: itemGroupCenterX(player), y: itemIconLayout(player, 1).y };
        ctx.save();
        ctx.translate(center.x, center.y + 61);
        ctx.scale(1 / worldScaleX, 1);
        ctx.globalAlpha = state.turn === playerIndex ? 1 : 0.7;
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.strokeStyle = player.dark;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(-39, -10, 78, 20, 7);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#f2b63d";
        ctx.strokeStyle = "#9b6f16";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(-25, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = player.dark;
        ctx.font = "900 12px Segoe UI, Malgun Gothic, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`${player.coins}코인`, 9, 0);
        ctx.restore();
      });
    }

    function drawItemTooltip() {
      const hover = state.hoveredItem;
      if (!hover || state.phase === "quiz") return;

      const player = state.players[hover.playerIndex];
      if (!player) return;

      const index = itemTypes.findIndex((item) => item.id === hover.item.id);
      if (index < 0) return;

      const layout = itemIconLayout(player, index);
      const screenX = layout.x * worldScaleX;
      const boxW = 238;
      const boxH = 74;
      const margin = 10;
      const shift = clamp(screenX, boxW / 2 + margin, W - boxW / 2 - margin) - screenX;
      const y = layout.y + 96;

      ctx.save();
      ctx.translate(layout.x, y);
      ctx.scale(1 / worldScaleX, 1);
      ctx.translate(shift, 0);

      ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
      ctx.strokeStyle = player.dark;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = player.dark;
      ctx.font = "900 15px Segoe UI, Malgun Gothic, Arial, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(`${hover.item.label} · ${hover.item.cost}코인`, -boxW / 2 + 12, -boxH / 2 + 10);

      ctx.fillStyle = "#26323d";
      ctx.font = "800 12px Segoe UI, Malgun Gothic, Arial, sans-serif";
      const text = hover.item.description;
      const first = text.length > 22 ? text.slice(0, 22) : text;
      const second = text.length > 22 ? text.slice(22) : "";
      ctx.fillText(first, -boxW / 2 + 12, -boxH / 2 + 34);
      if (second) ctx.fillText(second, -boxW / 2 + 12, -boxH / 2 + 51);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawSky();
      ctx.save();
      ctx.scale(worldScaleX, 1);
      drawWindRibbon();
      state.birds.forEach(drawBird);
      drawGround();
      state.obstacles.forEach(drawObstacle);
      state.players.forEach(drawPlayer);
      drawAim();
      drawProjectile();
      drawParticles();
      drawHitEffects();
      drawItemIcons();
      drawItemTooltip();
      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min((now - state.lastTime) / 1000, 0.033);
      state.lastTime = now;
      update(dt, now);
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (handleItemPointer(event)) return;
      canvas.setPointerCapture(event.pointerId);
      beginCharge(event);
    });
    canvas.addEventListener("pointermove", moveAim);
    canvas.addEventListener("pointerleave", () => {
      state.hoveredItem = null;
    });
    canvas.addEventListener("pointerup", endCharge);
    canvas.addEventListener("pointercancel", endCharge);
    restart.addEventListener("click", () => startRound());
    summaryNext.addEventListener("click", () => showModeSelect());
    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        chooseMode(button.dataset.mode, button.dataset.difficulty || "normal");
      });
    });

    startRound();
    showModeSelect();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
